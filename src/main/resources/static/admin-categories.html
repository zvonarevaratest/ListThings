<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListThings — категории</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin-common.js" defer></script>
  <script src="/admin-categories.js" defer></script>
</head>
<body>
<main class="category-admin">
  <a class="home-link" href="/">← К списку в поездку</a>
  <nav class="admin-nav" aria-label="Разделы админки">
    <a href="/admin">Вещи</a>
    <a href="/admin/categories" aria-current="page">Категории</a>
    <a href="/admin/activities">Цели поездки</a>
  </nav>
  <header class="catalog-header">
    <h1>Категории</h1>
    <button id="add" type="button" disabled>+ Добавить категорию</button>
  </header>
  <fieldset class="panel filters" id="filters" disabled>
    <legend>Поиск и фильтр</legend>
    <label for="search"><span id="search-label">Название категории</span>
      <input id="search" type="search" placeholder="Введите название">
    </label>
    <label for="type-filter">Тип
      <select id="type-filter">
        <option value="">Все типы</option>
      </select>
    </label>
  </fieldset>
  <p id="notice" class="notice" role="status"></p>
  <p id="error" class="error" role="alert"></p>
  <button id="retry" type="button" hidden>Повторить загрузку</button>
  <p id="status" role="status">Загрузка категорий…</p>
  <table id="catalog" class="catalog category-catalog" aria-label="Категории и количество вещей" hidden>
    <thead>
      <tr>
        <th scope="col">Категория</th>
        <th scope="col">Тип</th>
        <th scope="col">Количество вещей</th>
        <th scope="col">Действия</th>
      </tr>
    </thead>
    <tbody id="categories"></tbody>
  </table>

  <dialog id="category-dialog" aria-labelledby="dialog-title">
    <form id="category-form">
      <h2 id="dialog-title"></h2>
      <fieldset class="category-edit-fields" id="edit-fields">
        <label for="category-name"><span id="name-label">Название категории</span>
          <input id="category-name" type="text" required>
        </label>
        <label for="category-type">Тип
          <select id="category-type" required>
            <option value="">Выберите тип</option>
          </select>
        </label>
        <fieldset class="item-picker" id="item-picker">
          <legend id="item-picker-title">Вещи категории</legend>
          <label for="item-search">Поиск по вещам
            <input id="item-search" type="search" placeholder="Введите название вещи">
          </label>
          <div class="item-picker-actions">
            <span id="selected-items-count" role="status"></span>
            <button id="clear-items" class="secondary" type="button">Снять все отметки</button>
          </div>
          <div id="item-options" class="item-options"></div>
          <p id="item-search-empty" class="item-search-empty" role="status" hidden></p>
        </fieldset>
      </fieldset>
      <p id="delete-question" hidden></p>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel" class="secondary" type="button">Отмена</button>
        <button id="submit" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
