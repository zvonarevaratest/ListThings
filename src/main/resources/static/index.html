<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListThings — список в поездку</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>ListThings</h1>
  <p>Выбери транспорт, размещение и цели поездки, которые тебе подходят. Без выбора категорий создастся список универсальных вещей.</p>
  <div class="groups">
    <section class="panel"><h2>Транспорт</h2><div class="options" id="transport">Загрузка...</div></section>
    <section class="panel"><h2>Размещение</h2><div class="options" id="accommodation">Загрузка...</div></section>
    <section class="panel activity-panel"><h2>Цель поездки</h2><div class="options" id="activity">Загрузка...</div></section>
  </div>
  <button id="generate">Создать список</button>
  <p class="error" id="error" role="alert"></p>
  <section class="panel" id="results" hidden>
    <h2 id="count">Список вещей</h2>
    <ol class="result" id="items"></ol>
  </section>
</main>
<script>
  const categoryGroups = new Map([
    ['TRANSPORT', document.querySelector('#transport')],
    ['ACCOMMODATION', document.querySelector('#accommodation')],
    ['ACTIVITY', document.querySelector('#activity')]
  ]);
  const generate = document.querySelector('#generate');
  const error = document.querySelector('#error');
  const results = document.querySelector('#results');
  const items = document.querySelector('#items');
  function selectedIds() { return [...document.querySelectorAll('input[type=checkbox]:checked')].map(el=>el.value); }
  async function init() {
    try {
      const response = await fetch('/api/catalog/categories');
      if (!response.ok) throw new Error('Не удалось прочитать категории из MySQL');
      const categories = await response.json();
      for (const group of categoryGroups.values()) group.replaceChildren();
      for (const category of categories) {
        const target = categoryGroups.get(category.type);
        if (!target) continue;
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox'; input.value = category.id;
        label.append(input, document.createTextNode(category.name));
        target.append(label);
      }
      const activity = categoryGroups.get('ACTIVITY');
      if (!activity.childElementCount) activity.textContent = 'Цели поездки пока не добавлены.';
    } catch(e) {
      for (const group of categoryGroups.values()) group.replaceChildren();
      error.textContent = e.message;
    }
  }
  generate.addEventListener('click', async () => {
    error.textContent = '';
    try {
      const params = new URLSearchParams();
      for (const id of selectedIds()) params.append('categoryIds', id);
      const response = await fetch('/api/catalog/items?' + params);
      if (!response.ok) throw new Error('Не удалось сформировать список');
      const data = await response.json();
      items.replaceChildren();
      for (const item of data) {
        const li = document.createElement('li');
        li.textContent = item.name;
        items.append(li);
      }
      document.querySelector('#count').textContent = `Список вещей (${data.length})`;
      results.hidden = false;
      results.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e) { error.textContent = e.message; }
  });
  init();
</script>
</body>
</html>
