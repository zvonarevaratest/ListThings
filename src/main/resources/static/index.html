
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListThings</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .container {
            width: 320px;
            padding: 32px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000012;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
            border-radius: 6px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            border: none;
            color: white;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
        }

        .result {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .change-name {
            display: inline-block;
            margin-top: 16px;
            color: #2563eb;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Первоначальное приветствие -->
<div class="container" id="welcomeContainer">
    <div id="result" class="result"></div>

    <a href="#" id="changeName" class="change-name">
        Это не ты?
    </a>
</div>

<!-- Форма ввода имени -->
<div class="container" id="formContainer" style="display: none;">
    <h1>ListThings</h1>
    <p>Как тебя зовут?</p>

    <form id="nameForm" novalidate>
        <input
                id="name"
                type="text"
                placeholder="Введите имя"
        >

        <p id="error" class="error"></p>

        <button type="submit">Отправить</button>
    </form>
</div>

<script>
    const form = document.getElementById("nameForm");
    const input = document.getElementById("name");
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    const welcomeContainer =
        document.getElementById("welcomeContainer");

    const formContainer =
        document.getElementById("formContainer");

    const changeName =
        document.getElementById("changeName");


    // Получаем случайное имя из базы данных
    async function loadRandomName() {
        try {
            const response = await fetch("/random-name");

            if (!response.ok) {
                throw new Error("Ошибка сервера");
            }

            const name = await response.text();

            result.textContent = "Hello " + name;

        } catch (e) {
            result.textContent = "Не удалось загрузить имя";
            changeName.style.display = "none";
        }
    }


    // Открываем форму по ссылке
    changeName.addEventListener("click", function(event) {
        event.preventDefault();

        welcomeContainer.style.display = "none";
        formContainer.style.display = "block";
    });


    // Обрабатываем отправку формы
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        error.textContent = "";

        const name = input.value.trim();

        try {
            const response = await fetch(
                "/hello?name=" + encodeURIComponent(name)
            );

            const message = await response.text();

            if (response.ok) {
                formContainer.style.display = "none";

                result.textContent = message;
                changeName.style.display = "none";

                welcomeContainer.style.display = "block";

            } else {
                error.textContent = message;
            }

        } catch (e) {
            error.textContent = "Не удалось связаться с сервером.";
        }
    });


    // Запускаем получение имени при открытии страницы
    loadRandomName();

</script>
</body>
</html>
